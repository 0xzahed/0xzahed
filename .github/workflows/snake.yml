name: Generate Contribution Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: 0xzahed
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Fetch GitHub stats SVGs
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          mkdir -p dist
          curl -fsSL "https://streak-stats.demolab.com?user=0xzahed&theme=github-dark-blue&hide_border=true&border_radius=10" -o dist/streak-stats.svg
          curl -fsSL "https://github-readme-stats.vercel.app/api?username=0xzahed&show_icons=true&theme=github_dark&hide_border=true&border_radius=10&hide_rank=true" -o dist/github-stats.svg
          curl -fsSL "https://github-readme-stats.vercel.app/api/top-langs/?username=0xzahed&layout=compact&theme=github_dark&hide_border=true&border_radius=10" -o dist/top-langs.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
